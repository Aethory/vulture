[package]
name = "vulture"
version = "1.0.0"
edition = "2021"
description = "Vulture — all-in-one PC cleaner, optimizer and system care for Windows"
license = "MIT"
repository = "https://github.com/aethory/vulture"
readme = "README.md"
keywords = ["cleaner", "optimizer", "windows", "maintenance", "pc-care"]
categories = ["gui", "os::windows-apis", "filesystem"]

[dependencies]
eframe = "0.37"
egui = "0.37"
sysinfo = "0.40"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell",
] }
winreg = "0.56"
walkdir = "2.5"
blake3 = "1.8"
trash = "5.3"
rfd = "0.18"
dirs = "7.0"
humansize = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
